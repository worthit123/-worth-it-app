workflows:
  worth-it-ios:
    name: Worth It? iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: job worth it codemagic 3

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.worthit123
      xcode: latest

    scripts:
      - name: Extract iOS package
        script: |
          rm -rf ios_package
          mkdir -p ios_package
          unzip -q "Worth It? 2.zip" -d ios_package

      - name: Install CocoaPods
        script: |
          cd ios_package/src
          pod install --repo-update

      - name: Set up code signing
        script: |
          cd ios_package/src
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd ios_package/src
          xcode-project build-ipa \
            --workspace "Worth It?.xcworkspace" \
            --scheme "Worth It?"

    artifacts:
      - ios_package/src/build/ios/ipa/*.ipa
