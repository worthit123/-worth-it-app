workflows:
  worth-it-ios:
    name: Worth It? iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: job worth it codemagic 3

    environment:
      xcode: latest

      ios_signing:
        provisioning_profiles:
          - Worth It App Store 2
        certificates:
          - Worth It Distribution 3 uploaded

    scripts:
      - name: Extract iOS package
        script: |
          rm -rf ios_package
          mkdir -p ios_package
          unzip -q "Worth It? 2.zip" -d ios_package

      - name: Install CocoaPods
        script: |
          cd ios_package/src
          pod install --repo-update

      - name: Set up code signing
        script: |
          cd ios_package/src
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd ios_package/src
          xcode-project build-ipa \
            --workspace "Worth It?.xcworkspace" \
            --scheme "Worth It?" \
            --archive-flags="-destination 'generic/platform=iOS'" \
            --disable-xcpretty

    artifacts:
      - ios_package/src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
