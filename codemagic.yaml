workflows:
  worth-it-ios:
    name: Worth It? iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: job worth it codemagic 3

    environment:
      xcode: latest

    scripts:
      - name: Extract iOS package
        script: |
          rm -rf ios_package
          mkdir -p ios_package
          unzip -q "Worth It? 2.zip" -d ios_package

      - name: Install CocoaPods
        script: |
          cd ios_package/src
          pod install --repo-update

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "io.github.worthit123" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate
        script: |
          keychain add-certificates

      - name: Set up code signing
        script: |
          cd ios_package/src
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd ios_package/src
          xcode-project build-ipa \
            --workspace "Worth It?.xcworkspace" \
            --scheme "Worth It?"

    artifacts:
      - ios_package/src/build/ios/ipa/*.ipa
