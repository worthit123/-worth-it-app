workflows:
  worth-it-ios:
    name: Worth It? iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract iOS package
        script: |
          rm -rf ios_package
          mkdir -p ios_package
          unzip -q "Worth It? 2.zip" -d ios_package

      - name: Install CocoaPods
        script: |
          cd ios_package/src
          pod install --repo-update

      - name: Build iOS app
        script: |
          cd ios_package/src
          mkdir -p build
          xcodebuild \
            -workspace "Worth It?.xcworkspace" \
            -scheme "Worth It?" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - ios_package/src/build/Build/Products/Release-iphoneos/*.app
